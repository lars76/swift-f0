name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Check that the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }

      - name: Build
        run: uv build --no-sources

      # Run outside the checkout, where the source tree would shadow the installed distribution.
      - name: Import check (wheel)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -c "import numpy, swift_f0; print(swift_f0.__version__, swift_f0.SwiftF0().detect(numpy.zeros(16000), 16000).pitch_hz.shape)"

      - name: Import check (source distribution)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.tar.gz python -c "import numpy, swift_f0; print(swift_f0.__version__, swift_f0.SwiftF0().detect(numpy.zeros(16000), 16000).pitch_hz.shape)"

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swift-f0/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/swift-f0/
